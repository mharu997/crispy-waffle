[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pitds"
version = "0.1.0"
description = "Point-In-Time S&P 500 dataset (2010+) — survivorship-bias-free, free-data-only"
requires-python = ">=3.11"
authors = [{name = "PITDS"}]
dependencies = [
  "duckdb>=1.5",
  "pyarrow>=15",
  "pandas>=2.2",
  "polars>=1.0",
  "edgartools>=5.22",
  "httpx>=0.27",
  "tenacity>=9",
  "yfinance>=0.2.50",
  "pandas-datareader",
  "pandas-market-calendars>=4",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "mwclient",
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "loguru>=0.7",
  "python-dotenv>=1.0",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-xdist",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "ipykernel",
  "jupyter",
]

[project.scripts]
pitds = "pitds.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pitds"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
